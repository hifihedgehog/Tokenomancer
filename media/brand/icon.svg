<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The seed between staves: two whole-number staves, tenth ticks, and the reading as a lit
       diamond on its ± ribbon, midway between the .6 and .7 ticks. Edges sit on whole units so
       the 256 px export downsamples cleanly to 128 and 64; the staves also land on whole pixels at 32. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2456"/>
      <stop offset="1" stop-color="#15112C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".09"/>
    </linearGradient>
    <radialGradient id="glow" cx="73.5" cy="62" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9F86FF" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#9F86FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9F86FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="url(#rim)"/>
  <circle cx="73.5" cy="62" r="34" fill="url(#glow)"/>
  <g fill="#EEE8DA">
    <rect x="24" y="28" width="8" height="72" rx="4"/>
    <rect x="96" y="28" width="8" height="72" rx="4"/>
  </g>
  <g fill="#EEE8DA" fill-opacity=".45">
    <rect x="37" y="92" width="2" height="8" rx="1"/>
    <rect x="44" y="92" width="2" height="8" rx="1"/>
    <rect x="50" y="92" width="2" height="8" rx="1"/>
    <rect x="57" y="92" width="2" height="8" rx="1"/>
    <rect x="63" y="86" width="2" height="14" rx="1"/>
    <rect x="69" y="92" width="2" height="8" rx="1"/>
    <rect x="76" y="92" width="2" height="8" rx="1"/>
    <rect x="82" y="92" width="2" height="8" rx="1"/>
    <rect x="89" y="92" width="2" height="8" rx="1"/>
  </g>
  <rect x="55.5" y="57" width="36" height="10" rx="5" fill="#B9A6FF" fill-opacity=".3"/>
  <path d="M73.5 49 86.5 62 73.5 75 60.5 62Z" fill="#AE99FF"/>
  <path d="M73.5 49V62H60.5Z" fill="#D9D0FF"/>
  <path d="M73.5 49 86.5 62H73.5Z" fill="#C4B6FF"/>
  <path d="M73.5 62H86.5L73.5 75Z" fill="#9A84F5"/>
</svg>
