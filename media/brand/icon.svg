<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The seed between staves: two whole-number staves, tenth ticks, and the reading as a lit gem riding its
       ± ribbon midway between the .6 and .7 ticks. Stave edges sit on multiples of 4 so they stay crisp at
       128, 64 and 32 px; tick centres are the tenths rounded to whole units, symmetric about the .5 tick. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2761"/>
      <stop offset="1" stop-color="#120F25"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="glow" cx="73.5" cy="62" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9F86FF" stop-opacity=".7"/>
      <stop offset=".45" stop-color="#9F86FF" stop-opacity=".27"/>
      <stop offset="1" stop-color="#9F86FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stave" x1="0" y1="28" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#E3DBC9"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="54.5" x2="92.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9A6FF" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#B9A6FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#B9A6FF" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="url(#rim)"/>
  <circle cx="73.5" cy="62" r="38" fill="url(#glow)"/>
  <g fill="url(#stave)">
    <rect x="24" y="28" width="8" height="72" rx="4"/>
    <rect x="96" y="28" width="8" height="72" rx="4"/>
  </g>
  <g fill="#EEE8DA" fill-opacity=".42">
    <rect x="37" y="92" width="2" height="8" rx="1"/>
    <rect x="44" y="92" width="2" height="8" rx="1"/>
    <rect x="50" y="92" width="2" height="8" rx="1"/>
    <rect x="57" y="92" width="2" height="8" rx="1"/>
    <rect x="63" y="86" width="2" height="14" rx="1"/>
    <rect x="69" y="92" width="2" height="8" rx="1"/>
    <rect x="76" y="92" width="2" height="8" rx="1"/>
    <rect x="82" y="92" width="2" height="8" rx="1"/>
    <rect x="89" y="92" width="2" height="8" rx="1"/>
  </g>
  <rect x="54.5" y="57" width="38" height="10" rx="5" fill="url(#ribbon)"/>
  <!-- Four facets lit from the top left, so the gem reads as cut rather than flat. -->
  <path d="M73.5 47 58.5 62H73.5Z" fill="#DED6FF"/>
  <path d="M73.5 47 88.5 62H73.5Z" fill="#C7BAFF"/>
  <path d="M58.5 62 73.5 77V62Z" fill="#AD99FF"/>
  <path d="M88.5 62 73.5 77V62Z" fill="#957FF0"/>
</svg>
